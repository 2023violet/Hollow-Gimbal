# CMSIS-DAP SWD configuration for the at32f415xx target.

source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/at32f415xx.cfg]

# The upstream at32f415xx target script raises SWD speed to 5000 kHz.
# On this board + DAP-Link lane that setting makes `program ... verify`
# intermittently fail, so clamp it back to the proven-stable 50 kHz after the
# target file is loaded.
adapter speed 50

